# Serves the built SPA and proxies /api to the backend container, the same relationship the Vite
# dev server's proxy (vite.config.ts) gives you locally — so the frontend needs no build-time
# API URL baked in either way. Used by the frontend Dockerfile / docker-compose; not needed when
# deploying the static build to Vercel/Netlify/Cloudflare Pages (see docs/DEPLOYMENT.md), which
# instead talk to the backend's real public URL directly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (react-router): any path that isn't a real static file falls back to
    # index.html so a deep link like /study/return still loads the app instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
