[project]
name = "studymate-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Test doubles that imitate SDK objects are dynamically typed on purpose.
"tests/**" = ["D", "ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
